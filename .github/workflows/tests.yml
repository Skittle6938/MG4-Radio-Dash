# Tests unitaires du module d'aide (helper/src) sur la JVM : à chaque push sur main, sur les PR, et à la main.
# En local : gradle -p tests test (Gradle 8.x, JDK 17 ou plus).
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Unit tests
        run: gradle -p tests test --no-daemon
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: tests/build/reports/tests/test
          if-no-files-found: ignore
