name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! The more precise, the faster it gets fixed.
  - type: input
    id: version
    attributes:
      label: Radio Dash version
      description: MG4Dash › Settings › System, Radio Dash line (for example 1.5.2-beta7)
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware
      description: MG4Dash › Settings › System › Diagnostic, first line (for example SWI69-29958-1100R45)
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: How bad is it?
      options:
        - "Blocking: screen stuck, crash at start or a car function misbehaves"
        - "Annoying, but I can work around it"
        - "Minor or cosmetic"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where?
      options: [Radio, Display, Update, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: What you tapped, what you saw. Screenshots or photos help a lot.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: `adb logcat -d` if you have ADB.
      render: text
